name: Harness Regression

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  NODE_VERSION: "22"
  # Required for Prisma generation during npm ci; evals use isolated in-memory data.
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:1/todos_ci_codegen?schema=public

jobs:
  harness:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run eval suites
        run: npm run eval:all

      # The steps below run even when evals fail so failing trials' error.json
      # artifacts are preserved; the eval step alone still fails the job.
      - name: Verify eval harness guards
        if: ${{ !cancelled() }}
        run: NODE_ENV=test node --test evals/shared/app-harness.test.js

      - name: Verify issue alert command
        if: ${{ !cancelled() }}
        run: node --test scripts/harness/issue-alert.test.mjs

      - name: Generate harness cleanup report
        if: ${{ !cancelled() }}
        run: npm run harness:cleanup-report

      - name: Upload eval artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: harness-evals
          path: artifacts/evals

      - name: Upload harness report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: harness-cleanup-report
          path: artifacts/harness/cleanup-report

      - name: Notify harness regression
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/harness/issue-alert.mjs
